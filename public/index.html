<!DOCTYPE html>
<html lang="fo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tekst Stroyming</title>
    <link rel="stylesheet" href="style.css">
    <script src="lang.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div id="setup" class="setup-container">
        <h1 id="txt-setup-title"></h1>
        <input type="text" id="roomCode" autocomplete="off">
        <div style="display:flex; gap:10px; flex-wrap: wrap; justify-content: center;">
            <button onclick="init('writer')" id="txt-btn-create"></button>
            <button onclick="init('writer-ai')" id="txt-btn-create-ai" style="background: #28a745;">Stovna við AI</button>
            <button onclick="init('reader')" id="txt-btn-join"></button>
        </div>

        <div class="setup-info">
            <h2 id="txt-about-title"></h2>
            <p id="txt-about-p1"></p>
            <p id="txt-about-p2"></p>
            <p id="txt-about-p3"></p>
            <p id="txt-about-p4"></p>
            <p id="txt-about-p5"></p>
            <p id="txt-about-p6"></p>
            <p id="txt-about-p7"></p>
            <div class="footer-note" id="txt-about-footer"></div>
        </div>
    </div>

    <!-- Vanligt Writer UI -->
    <div id="writer-ui" class="hidden" style="padding: 20px; text-align: center;">
        <div class="reader-badge">👁️ <span id="reader-count">0</span> <span id="txt-readers-online"></span></div>
        <h2><span id="txt-writer-header"></span><span id="active-code"></span></h2>
        
        <div style="margin: 15px 0;">
            <label style="cursor: pointer; background: #e9ecef; padding: 10px; border-radius: 8px; font-weight: bold; color: black;">
                <input type="checkbox" onchange="updateTTSState(this.checked)" style="transform: scale(1.2); margin-right: 8px;">
                Loyv lesarum at brúka upplestur
            </label>
        </div>

        <div id="qrcode"></div>
        <br>
        <textarea id="writer-input"></textarea>
        <br><br>
        <button class="stop" onclick="terminate()" id="txt-writer-terminate"></button>
    </div>

    <!-- AI Writer UI -->
    <div id="writer-ai-ui" class="hidden" style="padding: 20px; text-align: center;">
        <div class="reader-badge">🤖 AI Rætting Virkin (<span id="reader-count-ai">0</span> <span id="txt-readers-online-ai"></span>)</div>
        <h2><span id="txt-writer-header-ai"></span><span id="active-code-ai"></span></h2>
        
        <div style="margin: 15px 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
            <div style="background: #f8f9fa; padding: 10px; border-radius: 8px; color: black;">
                <label style="font-weight: bold; font-size: 16px;">Mál hjá lesara:</label>
                <select id="ai-language" style="margin-left: 10px; padding: 6px 12px; font-size: 16px; border-radius: 8px;">
                    <option value="fo">Føroyskt (Rætta)</option>
                    <option value="da">Danskt (Umset)</option>
                    <option value="en">Enskt (Umset)</option>
                    <option value="no">Norskt (Umset)</option>
                </select>
            </div>
            
            <div style="background: #e9ecef; padding: 10px; border-radius: 8px; display: flex; align-items: center; color: black;">
                <label style="cursor: pointer; font-weight: bold;">
                    <input type="checkbox" onchange="updateTTSState(this.checked)" style="transform: scale(1.2); margin-right: 8px;">
                    Loyv lesarum at brúka upplestur
                </label>
            </div>
        </div>

        <div id="qrcode-ai"></div>

        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
            <div style="flex: 1; min-width: 300px;">
                <h3 style="font-size: 16px;">Dikteraður tekstur (Raw)</h3>
                <textarea id="ai-raw-input" placeholder="Byrja at diktera..."></textarea>
            </div>
            <div style="flex: 1; min-width: 300px;">
                <h3 style="font-size: 16px;">Rættaður tekstur (Gemini)</h3>
                <textarea id="ai-corrected-view" readonly style="background: rgba(0, 123, 255, 0.05); border: 2px solid var(--accent);"></textarea>
            </div>
        </div>
        <br>
        <button class="stop" onclick="terminate()" id="txt-writer-terminate-ai"></button>
    </div>

    <!-- Reader UI -->
    <div id="reader-ui" class="hidden">
        <div class="header">
            <button class="exit-btn" onclick="exitSession()" id="txt-reader-exit"></button>
            <select id="size-select" onchange="document.documentElement.style.setProperty('--size', this.value + 'px')"></select>
            <select id="theme-select" onchange="applyTheme(this.value)"></select>
            
            <!-- TTS Knappur fjaldur standard -->
            <button id="tts-toggle" onclick="toggleTTS()" style="padding: 6px 12px; border-radius: 8px; display: none;"></button>

            <div class="wpm-controls">
                <button onclick="adjustWPM(-10)">-</button>
                <span>WPM: <b id="wpm-display">200</b></span>
                <button onclick="adjustWPM(10)">+</button>
            </div>
            <div id="pause-indicator"><span class="dot"></span> <span id="txt-reader-pause"></span></div>
            <div id="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
        </div>
        <div id="output"></div>
    </div>

    <script>
        const socket = io();
        let currentRoom = "", currentRole = "", wpm = 200, isProcessing = false;
        let aiBuffer = "", lastSentText = "", fullTextReceived = "";
        let textQueue = [], pauseTimer = null, typingTimer = null, wakeLock = null;
        let ttsEnabled = false;

        function applyLanguage() {
            document.title = lang.title;
            document.getElementById('txt-setup-title').innerText = lang.setup_title;
            document.getElementById('roomCode').placeholder = lang.setup_placeholder;
            document.getElementById('txt-btn-create').innerText = lang.btn_create;
            document.getElementById('txt-btn-join').innerText = lang.btn_join;
            
            document.getElementById('txt-readers-online').innerText = lang.readers_online;
            document.getElementById('txt-readers-online-ai').innerText = lang.readers_online;
            
            const wHeader = document.getElementById('txt-writer-header');
            if(wHeader) wHeader.innerText = lang.writer_header;
            const wHeaderAi = document.getElementById('txt-writer-header-ai');
            if(wHeaderAi) wHeaderAi.innerText = lang.writer_header;
            
            const wInput = document.getElementById('writer-input');
            if(wInput) wInput.placeholder = lang.writer_placeholder;
            
            document.getElementById('txt-writer-terminate').innerText = lang.writer_terminate;
            document.getElementById('txt-writer-terminate-ai').innerText = lang.writer_terminate;
            
            document.getElementById('txt-reader-exit').innerText = lang.reader_exit;
            document.getElementById('txt-reader-pause').innerText = lang.reader_pause;
            
            const ttsBtn = document.getElementById('tts-toggle');
            if(ttsBtn) ttsBtn.innerText = lang.reader_tts_off || "🔈 Les upp";

            document.getElementById('txt-about-title').innerText = lang.about_title;
            document.getElementById('txt-about-p1').innerText = lang.about_p1;
            document.getElementById('txt-about-p2').innerText = lang.about_p2;
            document.getElementById('txt-about-p3').innerText = lang.about_p3;
            document.getElementById('txt-about-p4').innerText = lang.about_p4;
            document.getElementById('txt-about-p5').innerText = lang.about_p5;
            document.getElementById('txt-about-p6').innerText = lang.about_p6;
            document.getElementById('txt-about-p7').innerHTML = lang.about_p7.replace(
                'https://github.com/hogni89/textstreamer', 
                '<a href="https://github.com/hogni89/textstreamer" target="_blank" style="color:var(--accent)">GitHub</a>'
            );
            document.getElementById('txt-about-footer').innerText = lang.about_footer;

            document.getElementById('size-select').innerHTML = `
                <option value="40">${lang.reader_size_small}</option>
                <option value="60" selected>${lang.reader_size_medium}</option>
                <option value="90">${lang.reader_size_large}</option>`;
            document.getElementById('theme-select').innerHTML = `
                <option value="light">${lang.reader_theme_light}</option>
                <option value="dark">${lang.reader_theme_dark}</option>`;
        }

        applyLanguage();

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        function init(role) {
            currentRoom = document.getElementById('roomCode').value.trim();
            currentRole = role;
            if (!currentRoom) return alert(lang.alert_no_code);
            socket.emit(role.startsWith('writer') ? 'create-session' : 'join-session', currentRoom);
        }

        socket.on('session-created', (roomCode) => {
            document.getElementById('setup').classList.add('hidden');
            const isAI = (currentRole === 'writer-ai');
            const uiId = isAI ? 'writer-ai-ui' : 'writer-ui';
            const codeId = isAI ? 'active-code-ai' : 'active-code';
            const qrId = isAI ? 'qrcode-ai' : 'qrcode';
            
            document.getElementById(uiId).classList.remove('hidden');
            document.getElementById(codeId).innerText = roomCode;
            
            document.getElementById(qrId).innerHTML = "";
            new QRCode(document.getElementById(qrId), { text: window.location.origin + "?room=" + roomCode, width: 140, height: 140 });

            if (isAI) setupAIListeners(); else setupStandardListeners();
        });

        function setupStandardListeners() {
            const input = document.getElementById('writer-input');
            input.focus();
            input.addEventListener('input', (e) => {
                const currentText = e.target.value;
                if (currentText.length > lastSentText.length) {
                    const delta = currentText.slice(lastSentText.length);
                    socket.emit('text-delta', { roomCode: currentRoom, delta: delta, lang: 'fo' });
                    lastSentText = currentText;
                } else if (currentText.length === 0) {
                    socket.emit('text-reset', { roomCode: currentRoom });
                    lastSentText = "";
                } else {
                    lastSentText = currentText;
                }
            });
        }

        function setupAIListeners() {
            const input = document.getElementById('ai-raw-input');
            input.focus();
            input.addEventListener('input', (e) => {
                const currentText = e.target.value;
                if (currentText.length > lastSentText.length) {
                    aiBuffer += currentText.slice(lastSentText.length);
                }
                lastSentText = currentText;
            });

            // 2000 ms intervall til skjótari rætting
            setInterval(() => {
                if (aiBuffer.trim().length > 0 && currentRole === 'writer-ai') {
                    const textToSend = aiBuffer;
                    const targetLang = document.getElementById('ai-language').value;
                    aiBuffer = ""; 
                    socket.emit('process-ai-text', { roomCode: currentRoom, text: textToSend, targetLang: targetLang });
                }
            }, 2000); 
        }

        socket.on('ai-text-result', (correctedText) => {
            const aiView = document.getElementById('ai-corrected-view');
            aiView.value += correctedText + " ";
            aiView.scrollTop = aiView.scrollHeight; 
            
            const currentLang = document.getElementById('ai-language').value;
            socket.emit('text-delta', { roomCode: currentRoom, delta: correctedText + " ", lang: currentLang });
        });

        function updateTTSState(state) {
            socket.emit('set-tts-state', { roomCode: currentRoom, state: state });
        }

        socket.on('session-joined', (data) => {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('reader-ui').classList.remove('hidden');
            requestWakeLock();
            applyTTSState(data.ttsAllowed);
        });

        socket.on('tts-state-changed', (state) => {
            applyTTSState(state);
        });

        function applyTTSState(allowed) {
            const ttsBtn = document.getElementById('tts-toggle');
            if (allowed) {
                ttsBtn.style.display = 'inline-block';
            } else {
                ttsBtn.style.display = 'none';
                if (ttsEnabled) toggleTTS(); 
            }
        }

        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById('tts-toggle');
            if (ttsEnabled) {
                btn.innerText = lang.reader_tts_on || "🔊 Mállausur";
                const initUtterance = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(initUtterance);
            } else {
                btn.innerText = lang.reader_tts_off || "🔈 Les upp";
                window.speechSynthesis.cancel();
            }
        }

        socket.on('reader-count', (count) => {
            const badge = document.getElementById('reader-count');
            const badgeAi = document.getElementById('reader-count-ai');
            if (badge) badge.innerText = count;
            if (badgeAi) badgeAi.innerText = count;
        });

        socket.on('text-delta', (payload) => {
            let deltaText = payload.delta || payload; 
            let receivedLang = payload.lang || 'fo';

            const langMap = { 'fo': 'fo-FO', 'da': 'da-DK', 'en': 'en-US', 'no': 'nb-NO' };
            const ttsLocale = langMap[receivedLang] || 'fo-FO';

            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.style.display = "block";
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => indicator.style.display = "none", 2000);
            }
            
            const pIndicator = document.getElementById('pause-indicator');
            if (pIndicator) pIndicator.style.opacity = "0";
            clearTimeout(pauseTimer);
            pauseTimer = setTimeout(() => { if (fullTextReceived.length > 0) pIndicator.style.opacity = "1"; }, 10000);

            if (ttsEnabled && 'speechSynthesis' in window && deltaText.trim() !== "") {
                const utterance = new SpeechSynthesisUtterance(deltaText);
                utterance.lang = ttsLocale;
                window.speechSynthesis.speak(utterance);
            }

            textQueue.push(deltaText);
            fullTextReceived += deltaText;
            processQueue();
        });

        socket.on('text-reset', () => {
            textQueue = []; fullTextReceived = "";
            document.getElementById('output').innerHTML = '';
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        });

        async function processQueue() {
            if (isProcessing || textQueue.length === 0) return;
            isProcessing = true;
            const out = document.getElementById('output');
            while (textQueue.length > 0) {
                const chunk = textQueue.shift();
                const tokens = chunk.split(/(\r\n|\n|\r|\s+)/);
                for (let token of tokens) {
                    if (!token) continue;
                    const span = document.createElement('span');
                    if (token === '\n' || token === '\r' || token === '\r\n') {
                        span.innerHTML = '<br>';
                    } else {
                        span.className = 'word';
                        span.innerText = token;
                    }
                    out.appendChild(span);
                    if (token.trim()) {
                        await new Promise(r => setTimeout(r, (60 / wpm) * 1000));
                        
                        const rect = out.getBoundingClientRect();
                        const trigger = window.innerHeight * 0.95; 
                        if (rect.top + rect.height > trigger) {
                            window.scrollBy({ 
                                top: (rect.top + rect.height) - trigger, 
                                behavior: 'smooth' 
                            });
                        }
                    }
                }
            }
            isProcessing = false;
        }

        function adjustWPM(val) { wpm = Math.max(40, Math.min(400, wpm + val)); document.getElementById('wpm-display').innerText = wpm; }
        
        function applyTheme(theme) {
            const themes = { light: { bg: '#ffffff', text: '#000000' }, dark: { bg: '#000000', text: '#eeeeee' } };
            document.documentElement.style.setProperty('--bg', themes[theme].bg);
            document.documentElement.style.setProperty('--text', themes[theme].text);
        }

        function exitSession() { if(confirm(lang.confirm_exit)) location.href = window.location.origin + window.location.pathname; }
        function terminate() { if (confirm(lang.confirm_terminate)) socket.emit('stop-session', currentRoom); }
        
        socket.on('session-ended', () => { alert(lang.alert_session_ended); location.href = window.location.origin + window.location.pathname; });
        socket.on('session-error', (msg) => {
            if (msg === 'Henda sessiónskotan er longu í brúk.') alert(lang.error_session_exists);
            else if (msg === 'Sessiónin finst ikki.') alert(lang.error_session_missing);
            else alert(msg);
        });

        socket.on('connect', () => {
            if (currentRoom) {
                const isWriter = !document.getElementById('writer-ui').classList.contains('hidden') || !document.getElementById('writer-ai-ui').classList.contains('hidden');
                socket.emit(isWriter ? 'reclaim-session' : 'join-session', currentRoom);
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) { document.getElementById('roomCode').value = urlParams.get('room'); init('reader'); }

        setInterval(function() {
            fetch('/ping').catch(error => console.error('Feilur í ping:', error));
        }, 120000);
    </script>
</body>
</html>
